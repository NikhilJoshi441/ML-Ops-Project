# One command from a clean clone:   cp .env.example .env && docker compose up --build
# Scale the liability agent:        docker compose up -d --scale agent-worker=3
# Load test (LLM stub):             docker compose --profile loadtest up locust
#
# Deployment boundaries (see docs/ARCHITECTURE.md):
#   api            stateless edge, validation, rate limiting        -> scales with request rate
#   triage-agent   short LLM stage, no corpus access                 -> scales with submissions
#   agent-worker   long multi-step research/verification stage       -> scales with run concurrency
#   retriever      embedding model + index, memory/CPU heavy         -> own resource profile, re-index releases
#   llm-gateway    only holder of provider credentials, shared breaker and cache
#   llm-stub       fixed-response provider for load tests and keyless local runs
#   redis          queues, run state, caches, rate-limit buckets
x-light: &light
  build: { context: ., dockerfile: Dockerfile }
  image: dispute-triage:light
  env_file: .env
  environment: &env
    REDIS_URL: redis://redis:6379/0
    RETRIEVER_URL: http://retriever:8081
    LLM_GATEWAY_URL: http://llm-gateway:8082
    OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
    CORPUS_DIR: /app/corpus
  restart: unless-stopped
  extra_hosts: ["host.docker.internal:host-gateway"]

x-ml: &ml
  build: { context: ., dockerfile: Dockerfile.ml }
  image: dispute-triage:ml
  env_file: .env
  environment:
    <<: *env
    INDEX_DIR: /data/index
  volumes: [index-data:/data/index, hf-cache:/models]

services:
  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "512mb", "--maxmemory-policy", "noeviction"]
    volumes: [redis-data:/data]
    healthcheck: { test: ["CMD", "redis-cli", "ping"], interval: 5s, timeout: 3s, retries: 10 }
    restart: unless-stopped

  ingest:
    <<: *ml
    command: ["python", "-m", "triage.ingest.pipeline", "build"]
    restart: "no"

  retriever:
    <<: *ml
    command: ["uvicorn", "triage.retriever.service:app", "--host", "0.0.0.0", "--port", "8081"]
    environment:
      <<: *env
      INDEX_DIR: /data/index
      SERVICE_NAME: retriever
    depends_on:
      ingest: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    healthcheck: { test: ["CMD", "curl", "-fs", "http://localhost:8081/readyz"], interval: 10s, timeout: 5s, retries: 30, start_period: 60s }
    deploy: { resources: { limits: { memory: 2g } } }
    restart: unless-stopped

  llm-stub:
    <<: *light
    command: ["uvicorn", "triage.llm_stub.service:app", "--host", "0.0.0.0", "--port", "8090", "--workers", "2"]
    healthcheck: { test: ["CMD", "curl", "-fs", "http://localhost:8090/healthz"], interval: 10s, timeout: 3s, retries: 10 }

  llm-gateway:
    <<: *light
    command: ["uvicorn", "triage.llm_gateway.service:app", "--host", "0.0.0.0", "--port", "8082"]
    ports: ["8082:8082"]   # admin endpoints for the circuit-breaker demonstration
    depends_on:
      redis: { condition: service_healthy }
      llm-stub: { condition: service_healthy }
    healthcheck: { test: ["CMD", "curl", "-fs", "http://localhost:8082/readyz"], interval: 10s, timeout: 3s, retries: 10 }

  api:
    <<: *light
    command: ["uvicorn", "triage.api.main:app", "--host", "0.0.0.0", "--port", "8080", "--workers", "2"]
    ports: ["8080:8080"]
    depends_on:
      redis: { condition: service_healthy }
      llm-gateway: { condition: service_healthy }
    healthcheck: { test: ["CMD", "curl", "-fs", "http://localhost:8080/readyz"], interval: 10s, timeout: 3s, retries: 10 }

  triage-agent:
    <<: *light
    command: ["python", "-m", "triage.agents.worker", "triage"]
    depends_on:
      redis: { condition: service_healthy }
      llm-gateway: { condition: service_healthy }
    healthcheck: { test: ["CMD", "curl", "-fs", "http://localhost:9102/healthz"], interval: 10s, timeout: 3s, retries: 10 }

  agent-worker:
    <<: *light
    command: ["python", "-m", "triage.agents.worker", "liability"]
    depends_on:
      redis: { condition: service_healthy }
      llm-gateway: { condition: service_healthy }
      retriever: { condition: service_healthy }
    healthcheck: { test: ["CMD", "curl", "-fs", "http://localhost:9102/healthz"], interval: 10s, timeout: 3s, retries: 10 }

  prometheus:
    image: prom/prometheus:v2.55.1
    volumes: [./ops/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro, prom-data:/prometheus]
    ports: ["9090:9090"]
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.3.1
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-change-me}
    volumes:
      - ./ops/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./ops/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["3000:3000"]
    depends_on: [prometheus]
    restart: unless-stopped

  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    environment: { COLLECTOR_OTLP_ENABLED: "true" }
    ports: ["16686:16686"]
    restart: unless-stopped

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    restart: unless-stopped

  locust:
    <<: *light
    profiles: ["loadtest"]
    image: dispute-triage:loadtest
    build: { context: ., dockerfile: loadtest/Dockerfile }
    command: ["locust", "-f", "loadtest/locustfile.py", "--host", "http://api:8080", "--headless",
              "-u", "${LOCUST_USERS:-10}", "-r", "${LOCUST_SPAWN_RATE:-2}", "-t", "${LOCUST_DURATION:-3m}",
              "--csv", "loadtest/results/run"]
    volumes: [./loadtest/results:/app/loadtest/results]
    restart: "no"
    depends_on: { api: { condition: service_healthy } }

volumes:
  redis-data:
  index-data:
  hf-cache:
  prom-data:
